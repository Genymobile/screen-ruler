[package]
name = "ruler-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "screen-ruler application binary: Slint UI wired to ruler-core."

[[bin]]
name = "screen-ruler"
path = "src/main.rs"

[dependencies]
ruler-core = { path = "../ruler-core" }
# `unstable-winit-030` exposes the winit window, needed to pin each overlay
# fullscreen on a specific output. The winit backend is already built, so it
# adds no crates, but Slint may change that API in a minor release.
slint = { version = "1.18.0", features = ["unstable-winit-030"] }
